<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte des EHPAD</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --text: #1f2328; --muted: #5f6670;
    --border: #e2e0db; --accent: #1d6b5c; --accent-soft: #e3f0ec; --hover: #f1efea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181b; --panel: #1e2125; --text: #e8e6e3; --muted: #9aa0a6;
      --border: #30343a; --accent: #4fb39d; --accent-soft: #1d3530; --hover: #272b30;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: grid; grid-template-columns: 360px 1fr; grid-template-rows: 100vh;
  }
  aside {
    background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  header { padding: 20px 20px 12px; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; margin: 0; }
  .filters { padding: 0 20px 14px; display: grid; gap: 10px; border-bottom: 1px solid var(--border); }
  input[type=search], select {
    width: 100%; padding: 9px 11px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  }
  input[type=search]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  label.check { display: flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; }
  .count { font-size: 13px; color: var(--muted); }
  .count b { color: var(--accent); font-size: 15px; }
  #list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  #list li { padding: 11px 20px; border-bottom: 1px solid var(--border); cursor: pointer; }
  #list li:hover, #list li:focus { background: var(--hover); outline: none; }
  #list .name { font-weight: 600; font-size: 14px; }
  #list .city { color: var(--muted); font-size: 13px; }
  #list .more { color: var(--muted); font-size: 13px; text-align: center; cursor: default; }
  footer { padding: 10px 20px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); }
  footer a { color: var(--accent); }
  #map { height: 100%; width: 100%; background: var(--bg); }
  .leaflet-popup-content { font-size: 14px; line-height: 1.45; margin: 12px 14px; }
  .popup-name { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px;
         background: #e3f0ec; color: #1d6b5c; margin-top: 6px; }
  .tag.no { background: #f3ece2; color: #8a5a1c; }
  .popup-links a { margin-right: 10px; }
  .cap { display: flex; gap: 6px; margin-top: 8px; }
  .cap div { flex: 1; text-align: center; background: #f4f3ef; border-radius: 6px; padding: 5px 4px; }
  .cap b { display: block; font-size: 17px; color: #1d6b5c; line-height: 1.2; }
  .cap span { font-size: 11px; color: #666; }
  .cap-note { font-size: 12px; color: #777; margin-top: 4px; }
  #list .city .places { float: right; color: var(--accent); font-weight: 600; }
  #list .price { font-size: 13px; color: var(--text); margin-top: 1px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .prices { margin-top: 10px; border-top: 1px solid #e5e3de; padding-top: 8px; }
  .prices .big { font-size: 18px; font-weight: 700; color: #1d6b5c; }
  .prices table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 4px; }
  .prices td { padding: 2px 0; }
  .prices td:last-child { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .prices .sub td { color: #777; font-size: 12px; }
  .prices td[colspan] { text-align: left; padding-top: 6px; }
  .section { margin-top: 10px; border-top: 1px solid #e5e3de; padding-top: 8px; }
  .section h4 { margin: 0 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: #555; }
  .statut { font-size: 13px; }
  .statut b { font-weight: 600; }
  .lvl { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 5px;
         font-weight: 700; font-size: 13px; color: #fff; vertical-align: middle; }
  .lvl-A { background: #1b7f4c; } .lvl-B { background: #5c9e3c; } .lvl-C { background: #d08a1e; } .lvl-D { background: #c0392b; }
  .q-head { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .q-head .lvl { width: 30px; height: 30px; font-size: 17px; }
  .themes { margin-top: 6px; font-size: 12px; }
  .themes summary { cursor: pointer; color: #1d6b5c; }
  .th { display: grid; grid-template-columns: 1fr 70px 28px; gap: 6px; align-items: center; margin-top: 3px; }
  .bar { height: 6px; background: #eceae4; border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #1d6b5c; }
  .th span:last-child { text-align: right; font-variant-numeric: tabular-nums; color: #555; }
  #list .lvl { width: 18px; height: 18px; font-size: 11px; margin-right: 6px; }
  .leaflet-popup-content { max-width: 300px; }
  #toggle { display: none; }

  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: 100dvh; }
    aside { border-right: 0; border-bottom: 1px solid var(--border); max-height: 55dvh; }
    header { padding: 14px 16px 8px; }
    .filters { padding: 0 16px 10px; }
    #list li, footer { padding-left: 16px; padding-right: 16px; }
    aside.collapsed #list, aside.collapsed footer { display: none; }
    #toggle { display: inline; background: none; border: 0; color: var(--accent); font: inherit; font-size: 13px; padding: 0; cursor: pointer; }
    .count { display: flex; justify-content: space-between; }
  }
</style>
</head>
<body>
<aside id="panel" class="collapsed">
  <header>
    <h1>Les EHPAD de France</h1>
    <p class="sub">Établissements d'hébergement pour personnes âgées dépendantes</p>
  </header>
  <div class="filters">
    <input id="q" type="search" placeholder="Nom, ville ou code postal…" autocomplete="off" aria-label="Rechercher">
    <select id="dep" aria-label="Département"><option value="">Tous les départements</option></select>
    <div class="row">
      <select id="budget" aria-label="Budget mensuel">
        <option value="">Tout budget</option>
        <option value="2000">≤ 2 000 €/mois</option>
        <option value="2500">≤ 2 500 €/mois</option>
        <option value="3000">≤ 3 000 €/mois</option>
        <option value="3500">≤ 3 500 €/mois</option>
        <option value="4000">≤ 4 000 €/mois</option>
      </select>
      <select id="sort" aria-label="Trier par">
        <option value="ville">Tri : ville</option>
        <option value="prix">Tri : prix croissant</option>
        <option value="places">Tri : nombre de places</option>
        <option value="qualite">Tri : qualité HAS</option>
      </select>
    </div>
    <div class="row">
      <select id="statut" aria-label="Statut">
        <option value="">Tout statut</option>
        <option value="pub">Public</option>
        <option value="pnl">Privé non lucratif</option>
        <option value="com">Privé commercial</option>
      </select>
      <select id="qualite" aria-label="Qualité HAS">
        <option value="">Toute qualité</option>
        <option value="A">Qualité HAS : A</option>
        <option value="AB">Qualité HAS : A ou B</option>
        <option value="eval">Évalués par la HAS</option>
      </select>
    </div>
    <label class="check"><input id="hab" type="checkbox"> Habilités à l'aide sociale uniquement</label>
    <label class="check"><input id="tmp" type="checkbox"> Avec hébergement temporaire</label>
    <label class="check"><input id="jour" type="checkbox"> Avec accueil de jour</label>
    <div class="count"><span><b id="n">0</b> EHPAD affichés</span><button id="toggle" type="button">Voir la liste</button></div>
  </div>
  <ul id="list"></ul>
  <footer>Source : <a href="https://www.data.gouv.fr/fr/datasets/finess-extraction-du-fichier-des-etablissements/" target="_blank" rel="noopener">FINESS</a> (extraction du <span id="date"></span>) et <a href="https://www.data.gouv.fr/fr/datasets/prix-hebergement-et-tarifs-dependance-des-ehpad-donnees-brutes/" target="_blank" rel="noopener">prix CNSA</a>, <a href="https://www.data.gouv.fr/fr/datasets/resultats-devaluation-des-etablissements-et-services-sociaux-et-medico-sociaux-essms/" target="_blank" rel="noopener">évaluations HAS</a>, data.gouv.fr</footer>
</aside>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script src="ehpad.js"></script>
<script>
const DEPS = {"01":"Ain","02":"Aisne","03":"Allier","04":"Alpes-de-Haute-Provence","05":"Hautes-Alpes","06":"Alpes-Maritimes","07":"Ardèche","08":"Ardennes","09":"Ariège","10":"Aube","11":"Aude","12":"Aveyron","13":"Bouches-du-Rhône","14":"Calvados","15":"Cantal","16":"Charente","17":"Charente-Maritime","18":"Cher","19":"Corrèze","2A":"Corse-du-Sud","2B":"Haute-Corse","21":"Côte-d'Or","22":"Côtes-d'Armor","23":"Creuse","24":"Dordogne","25":"Doubs","26":"Drôme","27":"Eure","28":"Eure-et-Loir","29":"Finistère","30":"Gard","31":"Haute-Garonne","32":"Gers","33":"Gironde","34":"Hérault","35":"Ille-et-Vilaine","36":"Indre","37":"Indre-et-Loire","38":"Isère","39":"Jura","40":"Landes","41":"Loir-et-Cher","42":"Loire","43":"Haute-Loire","44":"Loire-Atlantique","45":"Loiret","46":"Lot","47":"Lot-et-Garonne","48":"Lozère","49":"Maine-et-Loire","50":"Manche","51":"Marne","52":"Haute-Marne","53":"Mayenne","54":"Meurthe-et-Moselle","55":"Meuse","56":"Morbihan","57":"Moselle","58":"Nièvre","59":"Nord","60":"Oise","61":"Orne","62":"Pas-de-Calais","63":"Puy-de-Dôme","64":"Pyrénées-Atlantiques","65":"Hautes-Pyrénées","66":"Pyrénées-Orientales","67":"Bas-Rhin","68":"Haut-Rhin","69":"Rhône","70":"Haute-Saône","71":"Saône-et-Loire","72":"Sarthe","73":"Savoie","74":"Haute-Savoie","75":"Paris","76":"Seine-Maritime","77":"Seine-et-Marne","78":"Yvelines","79":"Deux-Sèvres","80":"Somme","81":"Tarn","82":"Tarn-et-Garonne","83":"Var","84":"Vaucluse","85":"Vendée","86":"Vienne","87":"Haute-Vienne","88":"Vosges","89":"Yonne","90":"Territoire de Belfort","91":"Essonne","92":"Hauts-de-Seine","93":"Seine-Saint-Denis","94":"Val-de-Marne","95":"Val-d'Oise","9A":"Guadeloupe","9B":"Martinique","9C":"Guyane","9D":"La Réunion","9E":"Saint-Pierre-et-Miquelon","9F":"Mayotte"};
const DEP_NUM = {"9A":"971","9B":"972","9C":"973","9D":"974","9E":"975","9F":"976"};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\bsaint\b/g, "st").replace(/[-']/g, " ");
const fmtTel = t => t ? t.replace(/(\d{2})(?=\d)/g, "$1 ") : "";

$("date").textContent = new Date(window.EHPAD_DATE).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });

// Liste des départements présents
const present = [...new Set(EHPAD.map(e => e.d))].sort((a, b) => (DEP_NUM[a] || a).localeCompare(DEP_NUM[b] || b));
for (const d of present) {
  const o = document.createElement("option");
  o.value = d; o.textContent = `${DEP_NUM[d] || d} – ${DEPS[d] || d}`;
  $("dep").append(o);
}

const map = L.map("map", { preferCanvas: true }).setView([46.6, 2.4], 6);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

const cluster = L.markerClusterGroup({ chunkedLoading: true, showCoverageOnHover: false, maxClusterRadius: 50 });
map.addLayer(cluster);

const eur = (v, d = 2) => v.toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d }) + " €";
const row = (label, v, cls = "") => v != null ? `<tr class="${cls}"><td>${label}</td><td>${eur(v)}</td></tr>` : "";

function prices(e) {
  if (e.ref == null) return `<div class="prices cap-note">Prix non communiqués à la CNSA.</div>`;
  const g = e.g || [];
  return `<div class="prices">
    <div class="big">≈ ${eur(e.mois, 0)} / mois</div>
    <div class="cap-note">Chambre seule, hébergement + tarif dépendance GIR 5-6, sur 30 jours</div>
    <table>
      ${row("Chambre seule", e.pc)}
      ${row("Chambre double", e.pd)}
      ${row("Chambre seule (aide sociale)", e.pa)}
      ${row("Hébergement temporaire", e.tc)}
      ${g[2] != null ? `<tr class="sub"><td colspan="2">Tarif dépendance par jour (selon le GIR)</td></tr>` : ""}
      ${row("GIR 1-2", g[0], "sub")}${row("GIR 3-4", g[1], "sub")}${row("GIR 5-6", g[2], "sub")}
    </table>
    <div class="cap-note">Prix par jour déclarés à la CNSA le ${new Date(e.pm).toLocaleDateString("fr-FR")}. Pour les GIR 1 à 4, l'APA prend en charge une partie du tarif dépendance.</div>
  </div>`;
}

const STATUTS = { pub: "Public", pnl: "Privé non lucratif", com: "Privé commercial" };
const NIVEAUX = {
  A: "Démarche qualité avancée", B: "Démarche qualité structurée",
  C: "Démarche qualité partielle", D: "Démarche qualité insuffisante",
};
const THEMES = ["Bientraitance et éthique", "Droits de la personne", "Projet d'accompagnement personnalisé",
  "Expression et participation", "Accompagnement à l'autonomie", "Accompagnement à la santé",
  "Continuité des parcours", "Ressources humaines", "Démarche qualité et risques"];

function quality(e) {
  const fiche = `<a href="https://www.has-sante.fr/fiche-essms/${e.id}" target="_blank" rel="noopener">Fiche HAS</a>`;
  if (!e.q) return `<div class="section"><h4>Qualité (HAS)</h4><div class="cap-note">Pas encore d'évaluation publiée par la HAS. Les EHPAD sont évalués tous les 5 ans.</div></div>`;
  const themes = (e.qt || []).map((v, i) => v == null ? "" :
    `<div class="th"><span>${THEMES[i]}</span><span class="bar"><i style="width:${v / 4 * 100}%"></i></span><span>${v.toFixed(1)}</span></div>`).join("");
  return `<div class="section"><h4>Qualité (HAS)</h4>
    <div class="q-head"><span class="lvl lvl-${e.q}">${e.q}</span><div><b>${NIVEAUX[e.q]}</b><br>
      <span class="cap-note">Évaluation du ${new Date(e.qd).toLocaleDateString("fr-FR")}${e.qc ? ` · critères impératifs atteints : ${e.qc}` : ""}</span></div></div>
    ${themes ? `<details class="themes"><summary>Détail par thème (note sur 4)</summary>${themes}</details>` : ""}
    <div class="cap-note">Échelle de A (meilleur) à D. ${fiche}</div></div>`;
}

function popup(e) {
  const q = encodeURIComponent(`${e.n}, ${e.a}, ${e.v}`);
  return `<div class="popup-name">${esc(e.n)}</div>
    ${esc(e.a)}<br>${esc(e.v)}<br>
    ${e.t ? `☎ <a href="tel:${e.t}">${fmtTel(e.t)}</a><br>` : ""}
    ${e.st ? `<div class="statut" style="margin-top:6px"><b>${STATUTS[e.st]}</b>${e.gn ? ` · géré par ${esc(e.gn)}` : ""}</div>` : ""}
    <span class="tag ${e.h ? "" : "no"}">${e.h ? "Habilité à l'aide sociale" : "Non habilité à l'aide sociale"}</span>
    ${quality(e)}
    ${e.p != null ? `<div class="cap">
      <div><b>${e.p}</b><span>places permanentes</span></div>
      <div><b>${e.tp}</b><span>hébergement temporaire</span></div>
      <div><b>${e.aj}</b><span>accueil de jour</span></div>
    </div>
    <div class="cap-note">Capacité totale de l'établissement. Pour les places libres, contactez l'EHPAD ou faites une demande sur <a href="https://trajectoire.sante-ra.fr/" target="_blank" rel="noopener">ViaTrajectoire</a>.</div>` : ""}
    ${prices(e)}
    <div class="popup-links" style="margin-top:8px">
      <a href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Itinéraire et avis Google</a>
      <a href="https://www.pour-les-personnes-agees.gouv.fr/annuaire-ehpad-et-maisons-de-retraite" target="_blank" rel="noopener">Annuaire officiel</a>
    </div>
    <div style="color:#888;font-size:12px;margin-top:4px">FINESS ${e.id}</div>`;
}

for (const e of EHPAD) {
  e.key = norm(`${e.n} ${e.v} ${e.a}`);
  // Prix de référence : chambre seule, sinon tarif aide sociale (EHPAD 100 % habilités)
  e.ref = e.pc ?? e.pa ?? null;
  e.mois = e.ref != null ? Math.round((e.ref + (e.g?.[2] || 0)) * 30) : null;
  e.marker = L.marker([e.la, e.lo], { title: e.n }).bindPopup(() => popup(e), { maxWidth: 320, maxHeight: 460 });
}

let shown = [];
function apply(fit) {
  const q = norm($("q").value.trim()), dep = $("dep").value, hab = $("hab").checked;
  const tmp = $("tmp").checked, jour = $("jour").checked, budget = +$("budget").value;
  const statut = $("statut").value, qual = $("qualite").value;
  const okQual = e => !qual || (qual === "eval" ? !!e.q : qual.includes(e.q));
  const words = q.split(/\s+/).filter(Boolean);
  shown = EHPAD.filter(e => (!dep || e.d === dep) && (!hab || e.h) && (!tmp || e.tp > 0) && (!jour || e.aj > 0)
    && (!budget || (e.mois != null && e.mois <= budget)) && (!statut || e.st === statut) && okQual(e)
    && words.every(w => e.key.includes(w)));
  cluster.clearLayers();
  cluster.addLayers(shown.map(e => e.marker));
  $("n").textContent = shown.length.toLocaleString("fr-FR");
  renderList();
  if (fit && shown.length) {
    if (shown.length === EHPAD.length) map.setView([46.6, 2.4], 6);
    else map.fitBounds(L.latLngBounds(shown.map(e => [e.la, e.lo])), { padding: [30, 30], maxZoom: 15 });
  }
}

const LIST_MAX = 200;
function renderList() {
  const by = $("sort").value;
  const cmp = {
    ville: (a, b) => a.v.localeCompare(b.v, "fr"),
    prix: (a, b) => (a.mois ?? Infinity) - (b.mois ?? Infinity),
    places: (a, b) => (b.p || 0) - (a.p || 0),
    qualite: (a, b) => (a.q || "Z").localeCompare(b.q || "Z") || (a.mois ?? Infinity) - (b.mois ?? Infinity),
  }[by];
  const items = [...shown].sort(cmp).slice(0, LIST_MAX);
  $("list").innerHTML = items.map(e =>
    `<li tabindex="0" data-id="${e.id}"><div class="name">${esc(e.n)}</div><div class="city">${e.p ? `<span class="places">${e.p} places</span>` : ""}${esc(e.v)}</div>`
    + `<div class="price">${e.q ? `<span class="lvl lvl-${e.q}" title="Qualité HAS">${e.q}</span>` : ""}`
    + `${e.mois ? `≈ ${eur(e.mois, 0)} / mois` : ""}${e.st ? ` · ${STATUTS[e.st]}` : ""}</div></li>`).join("")
    + (shown.length > LIST_MAX ? `<li class="more">… et ${(shown.length - LIST_MAX).toLocaleString("fr-FR")} autres. Affinez la recherche.</li>` : "")
    + (!shown.length ? `<li class="more">Aucun EHPAD ne correspond.</li>` : "");
}

const byId = Object.fromEntries(EHPAD.map(e => [e.id, e]));
function focusOn(id) {
  const e = byId[id]; if (!e) return;
  if (window.innerWidth <= 760) $("panel").classList.add("collapsed"), $("toggle").textContent = "Voir la liste";
  cluster.zoomToShowLayer(e.marker, () => e.marker.openPopup());
}
$("list").addEventListener("click", ev => { const li = ev.target.closest("li[data-id]"); if (li) focusOn(li.dataset.id); });
$("list").addEventListener("keydown", ev => { if (ev.key === "Enter") { const li = ev.target.closest("li[data-id]"); if (li) focusOn(li.dataset.id); } });

let t;
$("q").addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => apply(true), 250); });
$("dep").addEventListener("change", () => apply(true));
for (const id of ["hab", "tmp", "jour", "budget", "statut", "qualite"]) $(id).addEventListener("change", () => apply(false));
$("sort").addEventListener("change", renderList);
$("toggle").addEventListener("click", () => {
  const c = $("panel").classList.toggle("collapsed");
  $("toggle").textContent = c ? "Voir la liste" : "Masquer la liste";
});

apply(false);
</script>
</body>
</html>
